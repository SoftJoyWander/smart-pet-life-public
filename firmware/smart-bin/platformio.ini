; 智能垃圾桶韌體建置設定
; 接線與腳位的由來見 docs/SMART_BIN_WIRING.md

[env]
; BLE 函式庫。選 NimBLE 而不是 ESP32 內建的 Bluedroid，是因為後者佔用的
; flash 與 RAM 大約是前者的三倍，而我們只需要一個很小的 GATT 伺服器。
; 版本鎖在 1.4.x：2.x 改了回呼的簽章，升級要一併改程式，不該由相依解析
; 自動發生。
lib_deps = h2zero/NimBLE-Arduino@^1.4.2

; framework = arduino 讓我們用 Arduino 的 API（digitalWrite 等），
; 比原生 ESP-IDF 好讀很多。底層仍然是 ESP-IDF，效能沒有損失。
framework = arduino
; 序列埠監看速度。板子和電腦要用同一個數字，否則 log 會是亂碼。
monitor_speed = 115200
; 編譯時把警告開到較嚴格，早點抓到型別錯誤
;
; ⚠️ DEV_PROVISIONING 讓序列埠可以佈建金鑰並把金鑰印出來，只供開發使用。
; 正式出貨的韌體必須移除這個旗標 —— 沒有它，佈建程式碼根本不會被編進去，
; 而不是只靠「記得不要用」。正式的佈建流程尚未決定，見 SMART_BIN_DESIGN.md。
build_flags = -Wall -D DEV_PROVISIONING

; ─── 目標平台一：ESP32-C3（你的主要板子）───
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
; ⚠️ 必須覆寫成 dio，不能用板子定義預設的 qio。
; 這塊板子的 flash 是 Boya（製造商代碼 0x68）而不是原廠常用的 GD/Winbond。
; QIO 模式的啟用方式各家 flash 不同，bootloader 切換失敗會直接重置，
; 症狀是 ROM 交棒後什麼都沒印就不斷重開機（2026-09-14 實測遇到）。
; 代價是讀取速度略慢，對這個專案沒有影響。
board_build.flash_mode = dio
; PIN_PROFILE_C3 是我們自己定義的旗標，main.cpp 會依它挑腳位。
; -D 的意思是「編譯時定義這個名稱」，等同在程式最上面寫 #define。
build_flags = ${env.build_flags} -D PIN_PROFILE_C3

; ─── 目標平台二：ESP32-WROOM-32（套裝附的板子，開發期備援）───
[env:esp32-wroom]
platform = espressif32
board = esp32dev
build_flags = ${env.build_flags} -D PIN_PROFILE_WROOM
